<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"><style>
.steps { display: flex; gap: 6px; padding: 0 24px; }
.steps span { flex: 1; height: 5px; border-radius: 3px; background: #e2dccf; }
.steps span.on { background: var(--green); }
.steplabel { padding: 10px 24px 0; font-size: 13px; color: var(--ink-2); }
h2 { padding: 6px 24px 0; font-size: 23px; font-weight: 700; }
.photo { display: flex; gap: 14px; align-items: center; margin: 18px 24px 4px; }
.photo .ph { width: 86px; height: 86px; border-radius: 22px; overflow: hidden; position: relative; }
.photo .add { width: 86px; height: 86px; border-radius: 22px; border: 2px dashed #c9c0b0; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #a69b88; }
.photo p { font-size: 12px; color: var(--ink-2); line-height: 1.5; flex: 1; }
.field { margin: 10px 24px 0; }
.field label { display: block; font-size: 13px; color: var(--ink-2); font-weight: 500; margin-bottom: 5px; }
.field .in { background: var(--white); border: 1px solid var(--line); border-radius: 12px; height: 46px; line-height: 44px; padding: 0 14px; font-size: 16px; display: flex; justify-content: space-between; }
.field .in small { color: var(--ink-2); font-size: 13px; }
.row { display: flex; gap: 10px; margin: 0 24px; } .row .field { flex: 1; margin-left: 0; margin-right: 0; }
.field .ta { height: auto; line-height: 1.55; padding: 10px 14px; font-size: 14px; display: block; }
.tags { margin: 8px 24px 0; display: flex; flex-wrap: wrap; gap: 7px; }
.tags span { font-size: 13px; padding: 6px 12px; border-radius: 16px; background: var(--white); border: 1px solid var(--line); }
.tags span.on { background: var(--green-soft); border-color: var(--green-soft); color: var(--green); font-weight: 700; }
.cta { position: absolute; left: 24px; right: 24px; bottom: 34px; }
.hint { font-size: 11px; color: var(--ink-2); margin-top: 4px; }
</style></head><body><div class="phone">
