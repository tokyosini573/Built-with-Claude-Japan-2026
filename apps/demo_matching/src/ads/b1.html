<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"><style>
.ad { position: relative; overflow: hidden; }
.mock { border-radius: 30px; border: 8px solid #1d2422; overflow: hidden; background: #1d2422; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
.mock img { display: block; width: 100%; }
.fine { font-size: 11px; line-height: 1.6; }
.store { display: inline-block; padding: 8px 14px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; }
.qr { width: 88px; height: 88px; background: #fff; padding: 6px; display: grid; grid-template-columns: repeat(11, 1fr); gap: 0; }
.qr i { background: #fff; } .qr i.k { background: #1d2422; }

.ad { width: 728px; height: 515px; background: var(--cream); display: flex; }
.left { flex: 1; padding: 40px 0 0 44px; position: relative; }
.right { width: 250px; background: var(--green); position: relative; }
.area { display: inline-block; background: var(--mustard); color: var(--ink); font-weight: 900; font-size: 16px; padding: 6px 14px; border-radius: 6px; }
h2 { font-family: "Zen Maru Gothic"; font-weight: 900; font-size: 34px; line-height: 1.4; margin-top: 18px; }
h2 em { font-style: normal; color: var(--green); }
.sub { font-size: 17px; line-height: 1.7; margin-top: 14px; color: var(--ink-2); }
.foot { position: absolute; left: 44px; right: 24px; bottom: 30px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.foot .logo-name { font-size: 30px; }
.foot .fine { color: var(--ink-2); }
.right .pin { position: absolute; width: 84px; height: 84px; border-radius: 50%; border: 4px solid #fff; overflow: hidden; }
.right .line { position: absolute; left: 0; right: 0; top: 250px; height: 8px; background: rgba(255,255,255,.25); }
.right .st { position: absolute; top: 243px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 5px solid var(--mustard); }
.right .qrbox { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); text-align: center; color: #fff; font-size: 12px; font-weight: 700; }
.right .qr { margin: 0 auto 6px; }
</style></head><body><div class="ad">
<div class="left">
  <span class="area">東京・神奈川・埼玉・千葉で配信中</span>
  <h2>帰りの電車の、<br>となりの駅の人と、<br><em>出会えるかもしれない。</em></h2>
  <p class="sub">近くに住む・働く人をおすすめする<br>マッチングアプリ。全員が本人確認済み。</p>
  <div class="foot"><span class="logo"><span class="logo-mark"><i></i><i></i></span><span class="logo-name" data-brand="name_ja">ちかくに</span></span><p class="fine">女性無料／男性 月額<span data-brand="price_male_jpy">3,980</span>円・18歳以上（高校生不可）<br>本人確認の審査は最大<span data-brand="review_hours">24</span>時間</p></div>
</div>
<div class="right">
  <div class="pin av" data-seed="1" data-kind="f" style="left:28px;top:120px"></div>
  <div class="pin av" data-seed="4" style="left:136px;top:290px"></div>
  <div class="line"></div><span class="st" style="left:40px"></span><span class="st" style="left:114px"></span><span class="st" style="left:188px"></span>
  <div class="qrbox"><div class="qr"></div>アプリはこちら</div>
</div>
</div><script src="../brand.js"></script><script src="../parts.js"></script><script>
// 中づりなどの QR は見た目だけのダミー（読み取れない）
document.querySelectorAll(".qr").forEach((q)=>{let s=7;for(let i=0;i<121;i++){s=(s*73+19)%101;const r=Math.floor(i/11),c=i%11;const f=(r<3&&c<3)||(r<3&&c>7)||(r>7&&c<3);const k=f?!(r%2===1&&c%2===1&&!(r===1&&c===1)&&!(r===1&&c===9)&&!(r===9&&c===1))||(r===1&&c===1)||(r===1&&c===9)||(r===9&&c===1):s%2===0;q.insertAdjacentHTML("beforeend",`<i class="${k?"k":""}"></i>`);}});
</script></body></html>
