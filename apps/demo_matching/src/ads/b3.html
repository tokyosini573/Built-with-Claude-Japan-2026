<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"><style>
.ad { position: relative; overflow: hidden; }
.mock { border-radius: 30px; border: 8px solid #1d2422; overflow: hidden; background: #1d2422; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
.mock img { display: block; width: 100%; }
.fine { font-size: 11px; line-height: 1.6; }
.store { display: inline-block; padding: 8px 14px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; }
.qr { width: 88px; height: 88px; background: #fff; padding: 6px; display: grid; grid-template-columns: repeat(11, 1fr); gap: 0; }
.qr i { background: #fff; } .qr i.k { background: #1d2422; }

.ad { width: 540px; height: 675px; background: var(--cream); padding: 40px; }
.area { display: inline-block; background: var(--green); color: #fff; font-weight: 700; font-size: 15px; padding: 5px 12px; border-radius: 6px; }
h2 { font-family: "Zen Maru Gothic"; font-weight: 900; font-size: 34px; line-height: 1.4; margin-top: 14px; }
.map { position: relative; height: 270px; margin-top: 18px; }
.pref { position: absolute; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; }
.dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--mustard); }
.foot { position: absolute; left: 40px; right: 40px; bottom: 34px; }
.foot .row { display: flex; justify-content: space-between; align-items: center; }
.foot .logo-name { font-size: 28px; }
.foot .fine { color: var(--ink-2); margin-top: 8px; }
</style></head><body><div class="ad">
<span class="area">首都圏で配信スタート</span>
<h2>通勤圏がいっしょの人と、<br>出会えるアプリ。</h2>
<div class="map">
  <div class="pref" style="left:0;top:0;width:250px;height:120px;background:#e8dfcd">埼玉県</div>
  <div class="pref" style="left:262px;top:0;width:198px;height:200px;background:#e8dfcd">千葉県</div>
  <div class="pref" style="left:0;top:132px;width:250px;height:76px;background:var(--green);color:#fff">東京都</div>
  <div class="pref" style="left:0;top:220px;width:250px;height:50px;background:#e8dfcd">神奈川県</div>
  <span class="dot" style="left:30px;top:146px"></span><span class="dot" style="left:215px;top:186px"></span><span class="dot" style="left:200px;top:180px"></span>
  <span class="dot" style="left:290px;top:30px"></span><span class="dot" style="left:420px;top:160px"></span><span class="dot" style="left:40px;top:30px"></span><span class="dot" style="left:210px;top:90px"></span><span class="dot" style="left:30px;top:240px"></span>
</div>
<div class="foot"><div class="row"><span class="logo"><span class="logo-mark"><i></i><i></i></span><span class="logo-name" data-brand="name_ja">ちかくに</span></span><span class="store">アプリを入手</span></div>
<p class="fine">東京・神奈川・埼玉・千葉にお住まいの方が対象。全員が本人確認済み。女性無料／男性 月額<span data-brand="price_male_jpy">3,980</span>円。18歳以上（高校生不可）。</p></div>
</div><script src="../brand.js"></script><script src="../parts.js"></script><script>
// 中づりなどの QR は見た目だけのダミー（読み取れない）
document.querySelectorAll(".qr").forEach((q)=>{let s=7;for(let i=0;i<121;i++){s=(s*73+19)%101;const r=Math.floor(i/11),c=i%11;const f=(r<3&&c<3)||(r<3&&c>7)||(r>7&&c<3);const k=f?!(r%2===1&&c%2===1&&!(r===1&&c===1)&&!(r===1&&c===9)&&!(r===9&&c===1))||(r===1&&c===1)||(r===1&&c===9)||(r===9&&c===1):s%2===0;q.insertAdjacentHTML("beforeend",`<i class="${k?"k":""}"></i>`);}});
</script></body></html>
