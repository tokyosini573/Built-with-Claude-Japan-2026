# デモアプリ「ちかくに」（架空の日本の恋愛マッチングアプリ）
# 画面と広告は src/ の HTML から tools/render.mjs で作る。name_ja は src/brand.js から自動で書き換わる。
# 両案とも広告費の合計は 5,000,000円。配分は事前に決めたもので、結果を見て変えない。
app_id: demo_matching
name_ja: ちかくに
preset: matching
min_age: 18
description_ja: >-
  20〜30代向けの恋愛マッチングアプリ。近くに住む・働く人をおすすめする（距離はおおよそで表示）。
  全員に本人確認（運転免許証・マイナンバーカード・パスポートの写真と顔写真、審査は最大24時間）が必須で、
  承認されるまでメッセージは送れない。女性は無料、男性はメッセージに月額3,980円の有料プランが必要。18歳以上（高校生不可）。
screens:
  - screens/01.png   # はじめの画面
  - screens/02.png   # プロフィール作成
  - screens/03.png   # 本人確認
  - screens/04.png   # 近くのおすすめ一覧
  - screens/05.png   # 有料プラン
gates:
  - id: id_verification
    name_ja: 本人確認
    docs_ja: 運転免許証・マイナンバーカード・パスポートのどれか1つの写真と、顔写真
    review_hours: 24
pricing: {monthly_jpy: 3980, free_trial_days: 0, who_pays: male}

plans:
  A:
    # 全国に SNS 広告を出す案
    regions: []                     # 全国
    period_days: 90
    campaign_days: 30
    target: {age: [20, 34], sex: any}
    channels:
      tiktok: 2000000     # 20代前半への到達が強く、CPM も安め。縦型動画が主力
      instagram: 2000000  # 20〜30代の利用が広く、恋愛アプリの広告で一般的な媒体
      x: 1000000          # 拡散の起点として補助的に。CTR が低めなので少なめ
    creatives: [ads/a1.png, ads/a2.png, ads/a3.png]   # a1: TikTok 縦 / a2: Instagram ストーリーズ / a3: X 縦
  B:
    # 首都圏（東京・神奈川・埼玉・千葉）に絞り、電車広告を軸にする案
    regions: [13, 14, 11, 12]
    period_days: 90
    campaign_days: 30
    target: {age: [20, 34], sex: any}
    channels:
      transit: 2500000    # 首都圏は鉄道の通勤・通学が多く、毎日同じ路線で繰り返し見てもらえる。年齢では絞れない
      instagram: 1500000  # 電車で見た人がSNSでも見かけるように、同じ地域の20〜34歳へ
      x: 1000000          # 首都圏内の拡散の起点として
    creatives: [ads/b1.png, ads/b2.png, ads/b3.png]   # b1: 中づり / b2: 車内ビジョン / b3: Instagram フィード
