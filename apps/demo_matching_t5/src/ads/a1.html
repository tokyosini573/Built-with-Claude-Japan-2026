<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"><style>
.ad { position: relative; overflow: hidden; }
.mock { border-radius: 30px; border: 8px solid #1d2422; overflow: hidden; background: #1d2422; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
.mock img { display: block; width: 100%; }
.fine { font-size: 11px; line-height: 1.6; }
.store { display: inline-block; padding: 8px 14px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; }
.qr { width: 88px; height: 88px; background: #fff; padding: 6px; display: grid; grid-template-columns: repeat(11, 1fr); gap: 0; }
.qr i { background: #fff; } .qr i.k { background: #1d2422; }

.ad { width: 540px; height: 960px; background: var(--cream); }
.top { padding: 70px 40px 0; }
.q { font-size: 22px; font-weight: 700; color: var(--ink-2); }
.h { font-family: "Zen Maru Gothic"; font-weight: 900; font-size: 37px; line-height: 1.35; margin-top: 10px; color: var(--ink); }
.h em { font-style: normal; color: var(--green); }
.mock { position: absolute; left: 110px; top: 250px; width: 320px; }
.bottom { position: absolute; left: 0; right: 0; bottom: 0; background: var(--green); color: #fff; padding: 22px 40px 60px; }
.bottom .row { display: flex; align-items: center; justify-content: space-between; }
.bottom .logo-name { color: #fff; font-size: 30px; }
.bottom .logo-mark i:first-child { background: #fff; }
.bottom .price { font-size: 17px; font-weight: 700; margin-top: 12px; }
.bottom .fine { opacity: .85; margin-top: 6px; }
</style></head><body><div class="ad">
<div class="top"><p class="q">仕事帰りに、お茶できる距離で。</p><p class="h">近くに住む人と、<br><em>好きなこと</em>の話から。</p></div>
<div class="mock"><img src="../../screens/04.png"></div>
<div class="bottom"><div class="row"><span class="logo"><span class="logo-mark"><i></i><i></i></span><span class="logo-name" data-brand="name_ja">ちかくに</span></span><span class="store">アプリを入手</span></div>
<p class="price">女性無料／男性 月額<span data-brand="price_male_jpy">2,980</span>円<br>相手に見えるのは都道府県とおおよその距離だけ</p>
<p class="fine">18歳以上（高校生不可）。メッセージは本人確認のあと（審査は最大<span data-brand="review_hours">12</span>時間）。<br>画面はイメージです。</p></div>
</div><script src="../brand.js"></script><script src="../parts.js"></script><script>
// 中づりなどの QR は見た目だけのダミー（読み取れない）
document.querySelectorAll(".qr").forEach((q)=>{let s=7;for(let i=0;i<121;i++){s=(s*73+19)%101;const r=Math.floor(i/11),c=i%11;const f=(r<3&&c<3)||(r<3&&c>7)||(r>7&&c<3);const k=f?!(r%2===1&&c%2===1&&!(r===1&&c===1)&&!(r===1&&c===9)&&!(r===9&&c===1))||(r===1&&c===1)||(r===1&&c===9)||(r===9&&c===1):s%2===0;q.insertAdjacentHTML("beforeend",`<i class="${k?"k":""}"></i>`);}});
</script></body></html>
