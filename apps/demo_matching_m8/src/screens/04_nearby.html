<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"><style>
.top { display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 0; }
.top .logo-name { font-size: 22px; }
.top .filter { font-size: 13px; font-weight: 700; color: var(--green); background: var(--green-soft); padding: 6px 12px; border-radius: 6px; }
h2 { padding: 12px 20px 0; font-size: 21px; font-weight: 700; }
.sub { padding: 2px 20px 0; font-size: 13px; color: var(--ink-2); }
.banner { margin: 12px 16px 0; padding: 11px 14px; border-radius: 8px; background: var(--mustard-soft); display: flex; gap: 10px; align-items: center; }
.banner i { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--mustard); color: #fff; font-style: normal; font-weight: 900; text-align: center; line-height: 30px; }
.banner p { font-size: 12.5px; line-height: 1.5; color: #8a3a26; }
.banner b { font-size: 13.5px; }
.grid { display: flex; flex-direction: column; gap: 9px; padding: 12px 16px 0; }
.card { background: var(--white); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); display: flex; align-items: center; height: 104px; }
.card .av { width: 104px; height: 104px; flex: none; position: relative; }
.card .body { padding: 9px 14px; }
.card .nm { font-size: 15px; font-weight: 700; }
.card .dist { font-size: 12px; color: var(--green); font-weight: 700; margin-top: 2px; }
.card .meta { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; }
.card .ok { display: inline-block; margin-top: 6px; font-size: 10.5px; font-weight: 700; color: var(--green); background: var(--green-soft); padding: 2px 7px; border-radius: 10px; }
</style></head><body><div class="phone">
