# バックテスト case_03: オンライン英会話（個人向けサブスク）
# 入力の出どころ: 03_조사/backtest/cases_inputs.md の case_03 だけ。変化後の結果は使っていない。
# シミュレーションの日: 1日目 = 2022-07-01、396日目 = 2023-07-31（backtest/questions.yaml の cases.case_03）。
app_id: bt_case_03
name_ja: 事例03（匿名）
title_ja: オンライン英会話（個人向けサブスク）   # 画面に出す匿名の事例名（エンジン・判断は読まない）
preset: subscription        # cases_inputs case_03「プリセット subscription（学習）」確認済み
min_age: 18                 # 推定、根拠: cases_inputs case_03「20〜50代の社会人中心」。個人向けの月額契約
description_ja: >-
  海外の講師と1対1で話す、月額定額制のオンライン英会話。アプリと Web で毎日25分のレッスンを受けられる。
  事前学習の教材、日本人講師のカウンセリング、レッスン録音の機能がある。
screens: []
gates: []                   # cases_inputs case_03「関門 なし（会員登録・決済のみ）（推定）」
pricing:
  monthly_jpy: 6000         # 推定、根拠: cases_inputs case_03「主力プランで月額 6,000円台前後（毎日25分のプラン）（推定）」
  free_trial_days: 7        # 推定、根拠: cases_inputs case_03「無料体験レッスンあり（2回程度）」→ 体験2回を約1週間とした
plans:
  A:
    regions: []             # 全国（確認済み）
    period_days: 396
    target: {age: [20, 59], sex: any}   # 推定、根拠: cases_inputs case_03「20〜50代の社会人中心（推定）」
    # 広告費: 公開なし（「個人向け広告は控えめ」推定）。期間中ずっと同じ水準とする。
    # 推定、根拠: 全事例共通の規則「変化前の四半期売上の10%を毎四半期」。
    #   変化前の直近の四半期売上 9.77億円（2022年7〜9月、確認済み）→ 9,770万円/四半期。396日分 ≒ 9,770万円 × 396 / 91.25 ≒ 4.24億円。
    # 配分は全事例共通の既定。根拠: cases_inputs case_03「Web 広告・SNS 広告、比較サイト（推定）」
    campaign_days: 396
    channels: {instagram: 127200000, youtube: 127200000, x: 84800000, line: 84800000}
    initial_state:
      # 推定、根拠: 会員数の公開なし。直前の四半期売上 10.19億円（2022年4〜6月、確認済み）÷ 3か月 ÷ 6,000円 ≒ 5.66万人。
      #   この売上には子会社の資格講座が含まれるので多めの見積もり。
      payers: 56600
      # 推定、根拠: 有料のみのサービス → 全事例共通の規則 active = payers
      active: 56600
      as_of_day_since_launch: 1825   # 推定、根拠: 開始日の記載なし → 全事例共通の既定 1,825日
    changes:
      # 値上げ（新規から）: cases_inputs case_03「2022年10月1日以降の新規会員から約10〜25%値上げ」→ 93日目。
      # 幅は推定、根拠: 10〜25% の中央 17.5% → 6,000円 × 1.175 = 7,050円
      - {day: 93, pricing: {monthly_jpy: 7050}, applies_to: new}
      # 既存会員の移行: cases_inputs case_03「既存会員は2022年11月から2023年5月にかけて順次新料金プランへ移した
      # （2022年11月 7.5%、2023年1月 17.8%、2023年5月までに全員）」（確認済み、予定ベースを含む）。
      # phase_in_days で均等に移す: 2022-11-01（124日目）から 2023-05-31（335日目）まで 212日
      # （均等の移し方は推定。実際は1月までが遅く、その後が速い）
      - {day: 124, pricing: {monthly_jpy: 7050}, applies_to: all, phase_in_days: 212}
# エンジン外: 新機能（事前学習・カウンセリング・録音）の追加、プラン別の金額、子会社の資格講座の売上
