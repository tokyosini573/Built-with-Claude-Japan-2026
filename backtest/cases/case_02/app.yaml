# バックテスト case_02: 家計簿・資産管理アプリのプレミアム会員
# 入力の出どころ: リポジトリ外の調査メモ（非公開）の case_02 だけ。変化後の結果は使っていない。
# シミュレーションの日: 1日目 = 2025-03-01、275日目 = 2025-11-30（backtest/questions.yaml の cases.case_02）。
app_id: bt_case_02
name_ja: 事例02（匿名）
title_ja: 家計簿・資産管理アプリのプレミアム会員   # 画面に出す匿名の事例名（エンジン・判断は読まない）
preset: habit               # cases_inputs case_02「プリセット habit（家計簿＝毎日の記録・確認）」確認済み
min_age: 18                 # 推定、根拠: cases_inputs case_02 に記載なし。金融口座の連携を前提とするため18歳以上とした
description_ja: >-
  銀行口座・クレジットカードを自動で連携して、家計簿と資産の管理ができるアプリ。基本無料で、
  月額のプレミアム会員になると連携できる数や過去データの閲覧などが広がる。
screens: []
gates:
  # 推定、根拠: cases_inputs case_02「関門 金融機関口座の連携（ID・パスワード入力）が初期設定で必要。本人確認書類は不要（推定）」
  - id: account_link
    name_ja: 金融機関口座の連携
    docs_ja: 銀行・カードのログイン ID とパスワード
    review_hours: 0
pricing:
  monthly_jpy: 500          # cases_inputs case_02「月額 500円（クレジットカード払い）」確認済み。年額プランはエンジンで表せないので月額だけ
  free_trial_days: 30       # 推定、根拠: cases_inputs case_02「プレミアムの初回無料期間あり（1か月程度）（推定）」
plans:
  A:
    regions: []             # 全国（確認済み）
    period_days: 275
    target: {age: [20, 59], sex: any}   # 推定、根拠: cases_inputs case_02「20〜50代、会社員・共働き世帯中心（推定）」
    # 広告費: 公開なし。「大きな広告出稿の変化は公表なし」（推定）なので期間中ずっと同じ水準とする。
    # 推定、根拠: 全事例共通の規則「広告費が公開されていない事例は、変化前の四半期売上の10%を毎四半期出し続ける」。
    #   四半期売上は公開なし → 決済者 61.7万人 × 500円 × 3か月 = 9.255億円 → 10% = 9,255万円/四半期。
    #   275日分 = 9,255万円 × 275 / 91.25 ≒ 2.79億円。
    # 配分は全事例共通の既定（instagram 30% / youtube 30% / x 20% / line 20%）。
    #   根拠: cases_inputs case_02「アプリストア検索・自然流入、提携金融機関経由、Web 広告（推定）」。ストア検索・提携経由はエンジンのクチコミで代用
    campaign_days: 275
    channels: {instagram: 83700000, youtube: 83700000, x: 55800000, line: 55800000}
    initial_state:
      # cases_inputs case_02「プレミアム課金ユーザー数 2025年5月末 61.7万人以上」（確認済み）。5月末の値を1日目（3月1日）にも使う（推定）
      payers: 617000
      # 推定、根拠: 使っている人数の公開値なし（累計 1,730万人は利用中の人数ではない）。
      #   全事例共通の規則「基本無料のサービスで active が公開されていなければ決済者の3倍」→ 185.1万人
      active: 1851000
      # 推定、根拠: cases_inputs に開始日の記載なし。上場企業の主力サービスで数年以上 → 全事例共通の既定 1,825日
      as_of_day_since_launch: 1825
      # cases_inputs case_02「累計利用者数（DL＋Web 登録）1,730万人以上」（確認済み）→ 過去に設置した人（やめた人を含む）
      ever_installed: 17300000
    changes:
      # 値上げ: cases_inputs case_02「2025年8月5日から月額 540円。既存会員は次の更新時から適用」（確認済み）→ 158日目
      # applies_to: all = 既存の決済者にも次の更新日から（エンジンの仕様と一致）
      - {day: 158, pricing: {monthly_jpy: 540}, applies_to: all}
# エンジン外: 年額プラン（5,300円前後 → 5,940円、2025年9月5日以降の更新から）は月額に含めて扱った
